apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkboard-backend
  namespace: linkboard
  labels:
    app: linkboard-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkboard-backend
  template:
    metadata:
      labels:
        app: linkboard-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: linkboard-backend:latest   # replace with your registry path
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: linkboard-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: linkboard-backend
  namespace: linkboard
  labels:
    app: linkboard-backend
spec:
  type: ClusterIP
  selector:
    app: linkboard-backend
  ports:
    - port: 80
      targetPort: 4000
      name: http
